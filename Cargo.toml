[package]
name = "hp-scan-to-mac"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
libc = "0.2.191"
mdns-sd = "0.21.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "http2"] }
roxmltree = "0.21.2"
rusty-s3 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "signal", "fs", "process", "net", "io-util"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }
