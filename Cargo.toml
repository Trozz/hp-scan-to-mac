[package]
name = "hp-scan-to-mac"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart", "http2"] }
roxmltree = "0.21.2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "signal", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
